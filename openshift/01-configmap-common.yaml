apiVersion: v1
kind: ConfigMap
metadata:
  name: cinema-common
  namespace: tanejb-dev
  labels:
    app.kubernetes.io/part-of: cinema-microservices
data:
  MONGODB_URI: mongodb://mongo:27017
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_QUEUE: user.events
  MOVIES_DB_NAME: movies_db
  USERS_DB_NAME: users_db
  SCREENINGS_DB_NAME: screenings_db
  RESERVATIONS_DB_NAME: reservations_db
  LOG_LEVEL: INFO
  NODE_ENV: production

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-web
  namespace: tanejb-dev
  labels:
    app: api-gateway-web
    app.kubernetes.io/part-of: cinema-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-web
  template:
    metadata:
      labels:
        app: api-gateway-web
        app.kubernetes.io/part-of: cinema-microservices
    spec:
      containers:
        - name: api-gateway-web
          image: docker.io/tanej666/cinema-api-gateway-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: MOVIES_SERVICE_URL
              value: http://movies-service:3001
            - name: USERS_SERVICE_URL
              value: http://users-service:3002
            - name: SCREENINGS_SERVICE_URL
              value: http://screenings-service:3003
            - name: RESERVATIONS_GRPC_ADDR
              value: reservations-service:50051
            - name: CIRCUIT_BREAKER_ERROR_THRESHOLD
              value: "5"
            - name: CIRCUIT_BREAKER_RESET_MS
              value: "15000"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-web
  namespace: tanejb-dev
  labels:
    app: api-gateway-web
    app.kubernetes.io/part-of: cinema-microservices
spec:
  selector:
    app: api-gateway-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080

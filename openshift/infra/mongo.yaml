apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: tanejb-dev
  labels:
    app: mongo
    app.kubernetes.io/part-of: cinema-microservices
spec:
  replicas: 1
  # RWO volume: only one pod may mount mongo-data at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        app.kubernetes.io/part-of: cinema-microservices
    spec:
      # No custom fsGroup/runAsUser — OpenShift restricted-v2 assigns allowed IDs.
      containers:
        - name: mongo
          image: docker.io/library/mongo:7
          ports:
            - containerPort: 27017
              name: mongo
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          # TCP probes: mongosh exec often times out (default 1s) on sandbox nodes.
          startupProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        # Developer Sandbox: PVC (gp3) often stays Pending — use emptyDir for demo.
        # For persistent Mongo, use infra/mongo-pvc.yaml + switch volume to PVC (see README).
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: tanejb-dev
  labels:
    app: mongo
    app.kubernetes.io/part-of: cinema-microservices
spec:
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017

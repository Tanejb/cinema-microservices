apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservations-service
  namespace: tanejb-dev
  labels:
    app: reservations-service
    app.kubernetes.io/part-of: cinema-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservations-service
  template:
    metadata:
      labels:
        app: reservations-service
        app.kubernetes.io/part-of: cinema-microservices
    spec:
      containers:
        - name: reservations-service
          image: docker.io/tanej666/cinema-reservations-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: cinema-common
                  key: MONGODB_URI
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cinema-common
                  key: RESERVATIONS_DB_NAME
            - name: SERVICE_NAME
              value: reservations-service
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 25
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: reservations-service
  namespace: tanejb-dev
  labels:
    app: reservations-service
    app.kubernetes.io/part-of: cinema-microservices
spec:
  selector:
    app: reservations-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051

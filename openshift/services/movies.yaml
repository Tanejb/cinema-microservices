apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-service
  namespace: tanejb-dev
  labels:
    app: movies-service
    app.kubernetes.io/part-of: cinema-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movies-service
  template:
    metadata:
      labels:
        app: movies-service
        app.kubernetes.io/part-of: cinema-microservices
    spec:
      containers:
        - name: movies-service
          image: docker.io/tanej666/cinema-movies-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: cinema-common
                  key: NODE_ENV
            - name: PORT
              value: "3001"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: cinema-common
                  key: MONGODB_URI
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cinema-common
                  key: MOVIES_DB_NAME
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: movies-service
  namespace: tanejb-dev
  labels:
    app: movies-service
    app.kubernetes.io/part-of: cinema-microservices
spec:
  selector:
    app: movies-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001

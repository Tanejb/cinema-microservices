# Micro-frontend host + remotes. Images must be built with public Route URLs (see build-env.example).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-host
  namespace: tanejb-dev
  labels:
    app: web-host
    app.kubernetes.io/part-of: cinema-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-host
  template:
    metadata:
      labels:
        app: web-host
    spec:
      containers:
        - name: web-host
          image: docker.io/tanej666/cinema-frontend-host:latest
          imagePullPolicy: Always
          # Old images contain /app/vite.config.js; vite writes a .timestamp next to
          # the config which the random OpenShift UID cannot do in /app -> EACCES.
          # Point vite at an empty config in /tmp instead (writable for all).
          command: ["sh", "-c"]
          args: ["echo '' > /tmp/vite.config.js && cd /app && exec npx vite preview --config /tmp/vite.config.js --host 0.0.0.0 --port 4310 --strictPort"]
          env:
            - name: __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
              value: .openshiftapps.com
          ports:
            - containerPort: 4310
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 4310
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-host
  namespace: tanejb-dev
  labels:
    app: web-host
spec:
  selector:
    app: web-host
  ports:
    - name: http
      port: 4310
      targetPort: 4310
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web-host
  namespace: tanejb-dev
  labels:
    app: web-host
spec:
  to:
    kind: Service
    name: web-host
  port:
    targetPort: http
  tls:
    termination: edge
